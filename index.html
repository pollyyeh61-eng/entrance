<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VITALITY | 門店預約入口</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --unicorn-gradient: linear-gradient(45deg, #FF99F1, #A29BFE, #6C5CE7, #81ECEC);
            --dream-bg: #F0F2F8; 
        }
        body { 
            background-color: var(--dream-bg); 
            color: #2D3436; 
            font-family: 'Noto Sans TC', sans-serif; 
            scroll-behavior: smooth; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .unicorn-text { 
            background: var(--unicorn-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-family: 'Playfair Display', serif;
            filter: drop-shadow(0 2px 2px rgba(255, 255, 255, 0.8));
        }

        /* 滿版首圖容器 */
        .hero-container {
            height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 圖形化分類框 (保持原有設計) */
        .category-card {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid white;
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.15);
            margin-bottom: 1rem;
        }
        .category-card img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.65);
        }
        .category-card span {
            position: relative;
            z-index: 2;
            color: white;
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: 0.2em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        .unicorn-btn { 
            border: 2px solid #6C5CE7; 
            background: white;
            color: #4834D4;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.2);
        }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="text-xl unicorn-text font-black">VITALITY</div>
        <a href="http://booking.hairweb.net" class="text-xs font-black bg-purple-600 text-white px-4 py-2 rounded-full shadow-lg">立即預約</a>
    </nav>

    <section class="hero-container">
        <img src="沙龍.png" class="hero-img" alt="沙龍環境">
        <div class="absolute inset-0 bg-black/20 flex flex-col justify-center items-center text-center px-6">
            <h1 class="text-5xl unicorn-text mb-4 italic font-extrabold leading-tight">Holy Hair Salon</h1>
            <p class="text-white font-bold tracking-widest text-sm bg-black/30 px-4 py-2 rounded-lg">夢幻美學 · 極致體驗</p>
        </div>
    </section>

    <section id="intro" class="py-12 container mx-auto px-6">
        <div class="mb-10 text-center">
            <h3 class="text-3xl unicorn-text font-black mb-4">探索美學分類</h3>
            <p class="text-gray-700 font-bold leading-relaxed mb-8">職人精神，從接待、造型到洗護的極致堅持。</p>
        </div>

        <div class="space-y-4">
            <a href="空間.html" class="category-card block">
                <img src="接待區.png" alt="接待區">
                <span>美學空間</span>
            </a>
            <a href="造型.html" class="category-card block">
                <img src="造型.png" alt="造型">
                <span>大師造型</span>
            </a>
            <a href="洗髮.html" class="category-card block">
                <img src="洗髮.png" alt="洗髮">
                <span>極致洗髮</span>
            </a>
        </div>
    </section>

    <section id="portfolio" class="py-16 bg-white/50">
        <div class="container mx-auto px-2 text-center mb-8">
            <h2 class="text-3xl unicorn-text mb-2 font-black">Portfolio</h2>
            <p class="text-purple-600 text-[10px] tracking-widest font-black uppercase">傑作系列</p>
        </div>
        
        <div class="flex flex-row gap-1 px-1 justify-center">
            <div class="w-1/5"><img src="hair1.png" class="w-full aspect-[3/4] object-cover rounded-md border-2 border-white shadow-sm"></div>
            <div class="w-1/5"><img src="hair2.png" class="w-full aspect-[3/4] object-cover rounded-md border-2 border-white shadow-sm"></div>
            <div class="w-1/5"><img src="hair3.png" class="w-full aspect-[3/4] object-cover rounded-md border-2 border-white shadow-sm"></div>
            <div class="w-1/5"><img src="hair4.png" class="w-full aspect-[3/4] object-cover rounded-md border-2 border-white shadow-sm"></div>
            <div class="w-1/5"><img src="hair5.png" class="w-full aspect-[3/4] object-cover rounded-md border-2 border-white shadow-sm"></div>
        </div>
    </section>

    <footer class="py-16 text-center px-6">
        <a href="http://booking.hairweb.net" class="unicorn-btn w-full py-4 text-base uppercase inline-block rounded-xl shadow-lg">立即進入線上預約</a>
        <div class="mt-10 text-[10px] text-purple-300 font-bold tracking-widest">
            VITALITY BEAUTY © 2026<br>DESIGNED FOR CLIENTS
        </div>
    </footer>

</body>
</html>
