<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITALITY | 門店預約入口</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --unicorn-gradient: linear-gradient(45deg, #FF99F1, #A29BFE, #6C5CE7, #81ECEC);
            --dream-bg: #F0F2F8; 
        }
        body { background-color: var(--dream-bg); color: #2D3436; font-family: 'Noto Sans TC', sans-serif; scroll-behavior: smooth; }
        
        .unicorn-text { 
            background: var(--unicorn-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-family: 'Playfair Display', serif;
            filter: drop-shadow(0 2px 2px rgba(255, 255, 255, 0.8));
        }

        /* 預設手機版：沙龍圖滿版 */
        .salon-img-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        .salon-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 電腦版 (螢幕大於 1024px) 特別調整 */
        @media (min-width: 1024px) {
            .salon-img-container {
                height: 60vh; /* 電腦版圖片縮小高度，不佔滿全螢幕 */
                width: 80%;   /* 寬度也稍微內縮，看起來更精緻 */
                margin: 0 auto;
                border-radius: 30px; /* 增加一點圓角感 */
                box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            }
        }

        /* 分類框架圖形化 */
        .category-card {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid white;
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.15);
        }
        .category-card img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.65);
        }
        .category-card span {
            position: relative;
            z-index: 2;
            color: white;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 0.2em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        .unicorn-line { height: 3px; background: var(--unicorn-gradient); width: 80px; margin: 2rem auto; border-radius: 10px; }
        .unicorn-btn { border: 2px solid #6C5CE7; background: white; color: #4834D4; font-weight: 700; transition: 0.3s; }
        .unicorn-btn:hover { background: var(--unicorn-gradient); color: white; border-color: transparent; }
    </style>
</head>
<body>

    <section class="pt-32 pb-20 flex flex-col justify-center items-center text-center px-6">
        <h2 class="text-sm tracking-[0.6em] text-purple-500 mb-6 font-black uppercase">Premium Beauty Experience</h2>
        <h1 class="text-6xl md:text-8xl unicorn-text mb-8 italic font-extrabold">Holy Hair Salon</h1>
        <div class="unicorn-line"></div>
        <p class="text-lg font-bold text-gray-700 max-w-2xl mb-12 tracking-widest leading-relaxed">
            在光影與虹彩交織的空間，<br>為您的髮絲注入流光色彩，開啟您的尊榮蛻變之旅。
        </p>
        <a href="http://booking.hairweb.net" class="unicorn-btn px-16 py-4 text-sm uppercase inline-block rounded-full shadow-lg">進入預約系統</a>
    </section>

    <section class="salon-img-container">
        <img src="沙龍.png" alt="Salon Interior">
    </section>

    <section id="intro" class="py-24 container mx-auto px-8">
        <div class="text-center mb-16">
            <h3 class="text-4xl unicorn-text font-black mb-4">探索美學分類</h3>
            <p class="text-gray-700 font-bold text-lg">職人精神的極致堅持</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <a href="空間.html" class="category-card">
                <img src="接待區.png" alt="接待區">
                <span>美學空間</span>
            </a>
            <a href="造型.html" class="category-card">
                <img src="造型.png" alt="造型">
                <span>大師造型</span>
            </a>
            <a href="洗髮.html" class="category-card">
                <img src="洗髮.png" alt="洗髮">
                <span>極致洗髮</span>
            </a>
        </div>
    </section>

    <section id="portfolio" class="py-24 bg-white/60">
        <div class="container mx-auto px-8 text-center mb-12">
            <h2 class="text-4xl unicorn-text mb-2 font-black">Portfolio</h2>
        </div>
        <div class="flex flex-row gap-2 px-4 justify-center">
            <img src="hair1.png" class="w-1/5 aspect-[3/4] object-cover rounded-xl shadow-md border-4 border-white">
            <img src="hair2.png" class="w-1/5 aspect-[3/4] object-cover rounded-xl shadow-md border-4 border-white">
            <img src="hair3.png" class="w-1/5 aspect-[3/4] object-cover rounded-xl shadow-md border-4 border-white">
            <img src="hair4.png" class="w-1/5 aspect-[3/4] object-cover rounded-xl shadow-md border-4 border-white">
            <img src="hair5.png" class="w-1/5 aspect-[3/4] object-cover rounded-xl shadow-md border-4 border-white">
        </div>
    </section>

    <footer class="py-20 text-center">
        <div class="text-xs text-purple-400 font-bold tracking-widest uppercase">
            VITALITY BEAUTY © 2026. MAGIC REDEFINED.
        </div>
    </footer>

</body>
</html>
