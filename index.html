<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VITALITY | 門店預約入口</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --unicorn-gradient: linear-gradient(45deg, #FF99F1, #A29BFE, #6C5CE7, #81ECEC);
            --dream-bg: #F0F2F8; 
        }
        body { 
            background-color: var(--dream-bg); 
            color: #2D3436; 
            font-family: 'Noto Sans TC', sans-serif; 
            scroll-behavior: smooth; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .unicorn-text { 
            background: var(--unicorn-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-family: 'Playfair Display', serif;
            filter: drop-shadow(0 2px 2px rgba(255, 255, 255, 0.8));
        }
        
        /* WAP 專屬圖形化分類框架 */
        .category-card {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            height: 180px; /* 手機端高度優化 */
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid white;
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.15);
            margin-bottom: 1rem;
        }
        .category-card img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.65);
        }
        .category-card span {
            position: relative;
            z-index: 2;
            color: white;
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: 0.2em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        .unicorn-btn { 
            border: 2px solid #6C5CE7; 
            background: white;
            color: #4834D4;
            letter-spacing: 0.1em;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.2);
            font-weight: 700;
            text-align: center;
        }
        
        /* 作品集響應式優化 */
        .portfolio-img {
            border-radius: 15px;
            border: 3px solid white;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="text-xl unicorn-text font-black tracking-tighter">VITALITY</div>
        <a href="http://booking.hairweb.net" class="text-xs font-black bg-purple-600 text-white px-4 py-2 rounded-full">立即預約</a>
    </nav>

    <section class="min-h-screen flex flex-col justify-center items-center text-center px-6 pt-10">
        <h2 class="text-xs tracking-[0.4em] text-purple-500 mb-4 font-black">PREMIUM BEAUTY</h2>
        <h1 class="text-5xl unicorn-text mb-6 italic font-extrabold leading-tight">Holy Hair<br>Salon</h1>
        <p class="text-base font-bold text-gray-600 mb-10 leading-relaxed">
            在虹彩交織的空間，<br>為您量身打造專屬的美學時光。
        </p>
        <a href="#intro" class="animate-bounce text-purple-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="19 9l-7 7-7-7"></path></svg>
        </a>
    </section>

    <section id="intro" class="py-12 container mx-auto px-6">
        <div class="mb-10">
            <div class="rounded-2xl overflow-hidden shadow-xl border-4 border-white mb-6">
                <img src="沙龍.png" class="w-full h-auto">
            </div>
            <h3 class="text-3xl unicorn-text font-black mb-4">探索美學空間</h3>
            <p class="text-gray-700 font-bold leading-relaxed mb-8">
                從踏入店內的接待區開始，到專業的造型與洗髮療程，我們堅持每一個細節都要充滿藝術感。
            </p>
        </div>

        <div class="space-y-4">
            <a href="空間.html" class="category-card block">
                <img src="接待區.png" alt="接待區">
                <span>美學空間</span>
            </a>
            <a href="造型.html" class="category-card block">
                <img src="造型.png" alt="造型">
                <span>大師造型</span>
            </a>
            <a href="洗髮.html" class="category-card block">
                <img src="洗髮.png" alt="洗髮">
                <span>極致洗髮</span>
            </a>
        </div>
    </section>

    <section id="portfolio" class="py-16 bg-white/50">
        <div class="container mx-auto px-6 text-center mb-10">
            <h2 class="text-3xl unicorn-text mb-2 font-black">Portfolio</h2>
            <p class="text-purple-600 text-[10px] tracking-widest font-black uppercase">經典作品展示</p>
        </div>
        <div class="grid grid-cols-2 gap-4 px-4">
            <img src="hair1.png" class="portfolio-img">
            <img src="hair2.png" class="portfolio-img">
            <img src="hair3.png" class="portfolio-img">
            <img src="hair4.png" class="portfolio-img">
            <img src="hair5.png" class="portfolio-img" style="grid-column: span 2;">
        </div>
    </section>

    <footer class="py-20 text-center px-6">
        <h2 class="text-xl unicorn-text mb-8 font-black">預約您的夢幻時刻</h2>
        <a href="http://booking.hairweb.net" class="unicorn-btn w-full py-4 text-base uppercase inline-block rounded-xl shadow-lg">立即線上預約</a>
        <div class="mt-12 text-[10px] text-purple-300 font-bold tracking-widest">
            VITALITY BEAUTY © 2026<br>INTEGRATED WITH MENTOR 2.0
        </div>
    </footer>

</body>
</html>
