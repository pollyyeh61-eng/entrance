<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <title>VITALITY | 門店預約入口</title>
    
    <meta name="apple-mobile-web-app-title" content="VITALITY">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --unicorn-gradient: linear-gradient(45deg, #FF99F1, #A29BFE, #6C5CE7, #81ECEC);
            --dream-bg: #F0F2F8; 
        }
        body { background-color: var(--dream-bg); color: #2D3436; font-family: 'Noto Sans TC', sans-serif; scroll-behavior: smooth; }
        
        .unicorn-text { 
            background: var(--unicorn-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-family: 'Playfair Display', serif;
            filter: drop-shadow(0 2px 2px rgba(255, 255, 255, 0.8));
        }

        /* 預設手機版：沙龍圖滿版 */
        .salon-img-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        .salon-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 電腦版調整 */
        @media (min-width: 1024px) {
            .salon-img-container {
                height: 60vh; 
                width: 80%;   
                margin: 0 auto;
                border-radius: 30px; 
                box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            }
        }

        .category-card {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid white;
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.15);
        }
        .category-card img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.65);
        }
        .category-card span {
            position: relative;
            z-index: 2;
            color: white;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 0.2em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        .unicorn-line { height: 3px; background: var(--unicorn-gradient); width: 60px; margin: 2rem auto; border-radius: 10px; }
        .unicorn-btn { border: 2px solid #6C5CE7; background: white; color: #4834D4; font-weight: 700; transition: 0.3s; }
        .unicorn-btn:hover { background: var(--unicorn-gradient); color: white; border-color: transparent; }

        /* 燈箱樣式 */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #lightbox img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 153, 241, 0.3);
        }
        .portfolio-img { cursor: pointer; transition: transform 0.2s; }
        .portfolio-img:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <section class="pt-40 pb-24 flex flex-col justify-center items-center text-center px-8">
        <h2 class="text-[10px] tracking-[0.5em] text-purple-400 mb-6 font-black uppercase">Premium Beauty</h2>
        <h1 class="text-4xl md:text-8xl unicorn-text mb-6 italic font-extrabold leading-tight">Holy Hair Salon</h1>
        <div class="unicorn-line"></div>
        <p class="text-sm md:text-lg font-bold text-gray-500 max-w-xl mb-12 tracking-[0.15em] leading-relaxed">
            在光影與虹彩交織的空間，<br>為您的髮絲注入流光色彩。
        </p>
        <a href="http://booking.hairweb.net" class="unicorn-btn px-12 py-3.5 text-xs uppercase inline-block rounded-full shadow-lg tracking-widest">進入預約系統</a>
    </section>

    <section class="salon-img-container">
        <img src="沙龍.png" alt="Salon Interior">
    </section>

    <section id="intro" class="py-24 container mx-auto px-8">
        <div class="text-center mb-16">
            <h3 class="text-3xl md:text-4xl unicorn-text font-black mb-4">探索美學分類</h3>
            <p class="text-gray-700 font-bold text-base md:text-lg">職人精神的極致堅持</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <a href="空間.html" class="category-card">
                <img src="接待區.png" alt="接待區">
                <span>美學空間</span>
            </a>
            <a href="造型.html" class="category-card">
                <img src="造型.png" alt="造型">
                <span>大師造型</span>
            </a>
            <a href="洗髮.html" class="category-card">
                <img src="洗髮.png" alt="洗髮">
                <span>極致洗髮</span>
            </a>
        </div>
    </section>

    <section id="portfolio" class="py-24 bg-white/60">
        <div class="container mx-auto px-4 text-center mb-12">
            <h2 class="text-3xl md:text-4xl unicorn-text mb-2 font-black">Portfolio</h2>
            <p class="text-[10px] text-gray-400 font-bold tracking-widest">點擊圖片查看細節</p>
        </div>
        <div class="flex flex-row gap-1.5 md:gap-3 px-2 md:px-10 justify-center">
            <img src="hair1.png" onclick="openLightbox(this.src)" class="portfolio-img w-1/5 aspect-[3/4] object-cover rounded-lg md:rounded-xl shadow-md border-2 md:border-4 border-white">
            <img src="hair2.png" onclick="openLightbox(this.src)" class="portfolio-img w-1/5 aspect-[3/4] object-cover rounded-lg md:rounded-xl shadow-md border-2 md:border-4 border-white">
            <img src="hair3.png" onclick="openLightbox(this.src)" class="portfolio-img w-1/5 aspect-[3/4] object-cover rounded-lg md:rounded-xl shadow-md border-2 md:border-4 border-white">
            <img src="hair4.png" onclick="openLightbox(this.src)" class="portfolio-img w-1/5 aspect-[3/4] object-cover rounded-lg md:rounded-xl shadow-md border-2 md:border-4 border-white">
            <img src="hair5.png" onclick="openLightbox(this.src)" class="portfolio-img w-1/5 aspect-[3/4] object-cover rounded-lg md:rounded-xl shadow-md border-2 md:border-4 border-white">
        </div>
    </section>

    <footer class="py-24 text-center px-8 bg-white/40">
        <h3 class="text-xl unicorn-text font-black mb-8 tracking-widest">RESERVE YOUR DREAM</h3>
        <a href="http://booking.hairweb.net" class="unicorn-btn px-16 py-4 text-sm uppercase inline-block rounded-full shadow-xl tracking-widest">立即線上預約</a>
        <div class="mt-16 text-[10px] text-purple-300 font-bold tracking-[0.3em] uppercase">
            VITALITY BEAUTY © 2026. MAGIC REDEFINED.
        </div>
    </footer>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Large View">
    </div>

    <div id="install-guide" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-md px-6 py-4 rounded-2xl shadow-2xl z-[1000] flex items-center gap-4 border border-purple-200 animate-bounce md:hidden">
        <div class="text-xs font-bold text-gray-600">
            點擊 <span class="text-purple-600">"加入主畫面"</span><br>預約專屬髮型師更方便！
        </div>
        <button onclick="this.parentElement.style.display='none'" class="text-gray-400 text-lg">×</button>
    </div>

    <script>
        // 註冊 Service Worker (PWA 核心)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker 註冊成功！'))
                    .catch(err => console.log('Service Worker 註冊失敗：', err));
            });
        }

        // 燈箱控制
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // 安裝提示顯示邏輯
        if (window.innerWidth > 768) {
            document.getElementById('install-guide').style.display = 'none';
        }
    </script>

</body>
</html>
