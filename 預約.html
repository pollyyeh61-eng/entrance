<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>極致黑金 | 尊爵美學系統</title>
    <style>
        :root {
            --dark-bg: #0a0a0a;
            --gold-dim: rgba(212, 175, 55, 0.15);
            --gold-bright: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.5);
            --neon-blue: #00f2ff;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'PingFang TC', sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 120px;
        }

        /* 呼吸動畫 */
        @keyframes luxuryBreathe {
            0%, 100% { box-shadow: 0 0 12px var(--gold-dim); border-color: var(--gold-dim); }
            50% { box-shadow: 0 0 25px var(--gold-glow); border-color: var(--gold-bright); }
        }

        .panel { display: none; width: 92%; max-width: 420px; padding-top: 30px; }
        .panel.active { display: block; }

        /* ====== 作品輪播區 (依據 image_3fa646) ====== */
        .carousel-section { width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
        .main-display-area { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; margin-top: 15px; overflow: hidden; }
        #main-photo {
            width: 210px; height: 270px; object-fit: cover; border-radius: 18px;
            border: 2px solid var(--gold-bright); box-shadow: 0 0 20px var(--gold-glow);
            z-index: 5; transition: 0.5s;
        }
        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 42px; height: 42px; border: 2px solid var(--gold-bright);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.8); color: var(--gold-bright); font-size: 22px;
            cursor: pointer; z-index: 10; box-shadow: 0 0 10px var(--gold-glow);
        }
        .prev-btn { left: 8px; }
        .next-btn { right: 8px; }
        .side-thumbs { position: absolute; display: flex; gap: 5px; opacity: 0.25; filter: blur(1px); }
        .side-thumbs.left { left: -75px; }
        .side-thumbs.right { right: -75px; }
        .thumb-circle { width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--gold-dim); object-fit: cover; }

        /* ====== 預約區 & 表單 (修正日期時間選擇方式) ====== */
        .glass-card {
            background: linear-gradient(145deg, #111, #000);
            border: 1px solid var(--gold-dim); border-radius: 24px;
            padding: 22px; margin-bottom: 20px; animation: luxuryBreathe 4s infinite ease-in-out;
        }

        input, select {
            width: 100%; padding: 15px; margin-bottom: 12px; background: #080808; border: 1.5px solid #222;
            border-radius: 12px; color: #fff; box-sizing: border-box; font-size: 15px;
            appearance: none; -webkit-appearance: none;
        }
        
        /* 強制顯示日曆與時間圖示 */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(70%) sepia(50%) saturate(1000%) hue-rotate(10deg);
            cursor: pointer; font-size: 18px;
        }

        .btn {
            width: 100%; padding: 16px; margin-top: 5px; border-radius: 15px; border: 1.8px solid var(--gold-bright);
            background: transparent; color: var(--gold-bright); font-size: 16px; font-weight: bold; cursor: pointer;
            transition: 0.3s; letter-spacing: 3px;
        }
        .btn:active { background: var(--gold-bright); color: #000; }

        /* ====== 底部切換鈕 ====== */
        .tab-switcher {
            display: flex; background: #111; border-radius: 50px; padding: 5px; margin: 20px auto; width: 220px;
            border: 1px solid #333;
        }
        .tab-btn {
            flex: 1; padding: 10px; border-radius: 40px; border: none; background: transparent;
            color: #666; font-size: 13px; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { background: var(--gold-bright); color: #000; font-weight: bold; }

        /* 預約歷史清單 */
        .history-item {
            background: rgba(255,255,255,0.04); padding: 16px; border-radius: 18px;
            margin-bottom: 12px; border-left: 4px solid var(--gold-bright);
        }
    </style>
</head>
<body>
         <div class="w-full h-[800px]">
           <iframe src="https://mentor2.hairweb.net/booking.html" class="w-full h-full border-0"></iframe>
</div>
    <div id="client" class="panel active">
        <h1 style="color:var(--gold-bright); text-align:center; letter-spacing:10px; margin: 20px 0 5px;">VOGUE</h1>
        <p style="text-align:center; font-size:10px; color:#444; letter-spacing:4px; margin-bottom:20px;">EXQUISITE BEAUTY SERVICE</p>

        <div class="carousel-section">
            <h4 style="color:var(--gold-bright); font-weight:300; margin:0; font-size:14px;">✨ 尊榮作品集</h4>
            <div class="main-display-area">
                <div class="nav-arrow prev-btn" onclick="prevImg()">&#10094;</div>
                <div class="side-thumbs left" id="thumbs-left"></div>
                <img id="main-photo" src="" alt="作品展示">
                <div class="side-thumbs right" id="thumbs-right"></div>
                <div class="nav-arrow next-btn" onclick="nextImg()">&#10095;</div>
            </div>
        </div>
        
        <div class="glass-card">
            <h3 style="color:var(--gold-bright); margin:0 0 15px 0; font-weight:300;">立即預約</h3>
            <input type="text" id="custName" placeholder="顧客姓名">
            <input type="tel" id="custPhone" placeholder="聯繫電話">
            <select id="custService">
                <option value="單色染髮">單色染髮</option>
                <option value="雙色染髮">雙色染髮</option>
                <option value="漂染髮">漂染髮</option>
                <option value="染前頭皮保養套餐">染前頭皮保養套餐</option>
                <option value="剪髮">剪髮</option>
                <option value="洗髮加剪髮">洗髮加剪髮</option>
                <option value="熱塑燙髮">熱塑燙髮</option>
                <option value="冷塑燙髮">冷塑燙髮</option>
                <option value="頂級頭皮養護">頂級頭皮養護</option>
                <option value="頂級護髮套餐">頂級護髮套餐</option>
            </select>
            <div style="display: flex; gap: 10px;">
                <input type="date" id="appDate">
                <input type="time" id="appTime">
            </div>
            <button class="btn" onclick="addBooking()">確認預約</button>
        </div>

        <div id="history-section">
            <h4 style="color:var(--gold-bright); margin-left:12px; font-weight:300;">預約歷史</h4>
            <div id="my-list"></div>
        </div>
    </div>

    <div id="designer" class="panel">
        <h1 style="text-align:center; color:var(--gold-bright);">ATELIER</h1>
        <div class="glass-card">
            <h3>作品管理</h3>
            <button class="btn" onclick="document.getElementById('photo-input').click()">📷 拍照上傳新作品</button>
            <input type="file" id="photo-input" style="display:none" accept="image/*" onchange="handleFileUpload(event)">
        </div>
        <div id="designer-content"></div>
    </div>

    <div class="tab-switcher">
        <button class="tab-btn active" id="btn-client" onclick="switchTab('client')">客戶入口</button>
        <button class="tab-btn" id="btn-designer" onclick="switchTab('designer')">設計師後台</button>
    </div>

    <script>
        const PWD = '0000';
        let isAuth = false;
        let photoList = [];
        let currentIdx = 0;

        window.onload = function() {
            // 自動設定日期為今天
            document.getElementById('appDate').valueAsDate = new Date();
            renderAll();
        };

        function switchTab(t) {
            if (t === 'designer' && !isAuth) {
                if (prompt("授權密碼") !== PWD) return;
                isAuth = true;
            }
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(t).classList.add('active');
            document.getElementById('btn-' + t).classList.add('active');
            renderAll();
        }

        // --- 輪播邏輯 ---
        function renderGallery() {
            photoList = JSON.parse(localStorage.getItem('luxury_photos') || '[]');
            const main = document.getElementById('main-photo');
            const lT = document.getElementById('thumbs-left');
            const rT = document.getElementById('thumbs-right');

            if (photoList.length === 0) {
                main.src = "https://via.placeholder.com/210x270/111/d4af37?text=VOGUE";
                return;
            }
            main.src = photoList[currentIdx];
            lT.innerHTML = ''; rT.innerHTML = '';
            for(let i=1; i<=2; i++){
                let l = (currentIdx - i + photoList.length) % photoList.length;
                let r = (currentIdx + i) % photoList.length;
                lT.innerHTML += `<img src="${photoList[l]}" class="thumb-circle">`;
                rT.innerHTML += `<img src="${photoList[r]}" class="thumb-circle">`;
            }
        }
        function nextImg() { currentIdx = (currentIdx + 1) % photoList.length; renderGallery(); }
        function prevImg() { currentIdx = (currentIdx - 1 + photoList.length) % photoList.length; renderGallery(); }

        // --- 預約邏輯 ---
        function addBooking() {
            const name = document.getElementById('custName').value;
            const date = document.getElementById('appDate').value;
            const time = document.getElementById('appTime').value;
            const serv = document.getElementById('custService').value;
            if(!name || !date || !time) return alert("請完整填寫日期與時間");

            let db = JSON.parse(localStorage.getItem('luxury_db') || '[]');
            db.push({
                id: Date.now(),
                name: name,
                service: serv,
                fullTime: `${date} ${time}`,
                status: '待處理'
            });
            localStorage.setItem('luxury_db', JSON.stringify(db));
            alert("預約成功！設計師將儘快為您確認");
            renderAll();
        }

        function handleFileUpload(e) {
            const reader = new FileReader();
            reader.onload = function(f) {
                let photos = JSON.parse(localStorage.getItem('luxury_photos') || '[]');
                photos.unshift(f.target.result);
                localStorage.setItem('luxury_photos', JSON.stringify(photos));
                currentIdx = 0;
                renderAll();
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        function renderAll() {
            renderGallery();
            const list = JSON.parse(localStorage.getItem('luxury_db') || '[]');
            const clientDiv = document.getElementById('my-list');
            const designerDiv = document.getElementById('designer-content');
            
            // 渲染客戶歷史 (解決 image_3fb226 的顯示問題)
            clientDiv.innerHTML = '';
            list.slice().reverse().forEach(item => {
                clientDiv.innerHTML += `
                    <div class="history-item">
                        <div style="font-size:16px; font-weight:bold; color:var(--gold-bright);">${item.service}</div>
                        <div style="font-size:12px; color:#aaa; margin-top:5px;">
                            📅 ${item.fullTime} <br> 
                            狀態：<span style="color:#fff;">${item.status}</span>
                        </div>
                    </div>`;
            });

            if (isAuth) {
                designerDiv.innerHTML = '<h3 style="color:var(--neon-blue);">接單管理</h3>';
                list.forEach((item, index) => {
                    designerDiv.innerHTML += `
                        <div class="history-item" style="border-left-color:var(--neon-blue)">
                            <strong>${item.name}</strong> - ${item.service}<br>
                            <small>${item.fullTime}</small><br>
                            ${item.status === '待處理' ? `<button class="btn" style="padding:5px; font-size:12px; margin-top:8px;" onclick="confirmOrder(${index})">接受預約</button>` : '✓ 已接單'}
                        </div>`;
                });
            }
        }

        function confirmOrder(idx) {
            let list = JSON.parse(localStorage.getItem('luxury_db') || '[]');
            list[idx].status = '已接單';
            localStorage.setItem('luxury_db', JSON.stringify(list));
            renderAll();
        }
    </script>
</body>

</html>
